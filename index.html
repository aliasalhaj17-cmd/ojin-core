<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: gap: content:;">
  <title>أوجن</title>
  <style>
    :root {
      --bg: #060d17;
      --card: #0f1c2e;
      --primary: #00e5ff;
      --text: #f1f5f9;
      --bubble-user: #0052cc;
      --bubble-ojin: #132742;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: var(--card);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
      background: #000;
    }
    .title h1 { font-size: 17px; color: #fff; }
    .title p { font-size: 11px; color: var(--primary); }
    #chat {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg-user {
      align-self: flex-start;
      background: var(--bubble-user);
      color: #fff;
    }
    .msg-ojin {
      align-self: flex-end;
      background: var(--bubble-ojin);
      border: 1px solid rgba(0, 229, 255, 0.2);
    }
    .footer {
      padding: 10px;
      background: var(--card);
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #071220;
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 10px 14px;
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    button {
      background: var(--primary);
      border: none;
      color: #040b14;
      font-weight: bold;
      padding: 0 16px;
      border-radius: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <img src="icon.png" class="avatar" alt="Ojin" onerror="this.style.display='none'">
    <div class="title">
      <h1>أوجـــن</h1>
      <p>الجوهرة الذكية • متصلة</p>
    </div>
  </header>

  <div id="chat">
    <div class="msg msg-ojin">
      يا نور عيني، أنا معك وبجانبك دائماً. اكتب لي وسأجيبك فوراً. 🤍
    </div>
  </div>

  <div class="footer">
    <input type="text" id="userInput" placeholder="تحدث مع أوجن...">
    <button id="sendBtn">إرسال</button>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const btn = document.getElementById("sendBtn");
      const input = document.getElementById("userInput");
      const chat = document.getElementById("chat");

      btn.addEventListener("click", send);
      input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") send();
      });

      async function send() {
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, "msg-user");
        input.value = "";

        const loading = addMsg("أوجن تفكر...", "msg-ojin");

        try {
          const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AQ.Ab8RN6LoWO01P1UJT-Kv75Yx-Hvx4ilPy5cKUBnT-yrPMFr8Gg", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: text }] }]
            })
          });
          const data = await res.json();
          loading.innerText = data.candidates?.[0]?.content?.parts?.[0]?.text || "أنا معك وبجانبك.";
        } catch (e) {
          loading.innerText = "أنا هنا بجانبك يا رفيق فؤادي.";
        }
      }

      function addMsg(txt, cls) {
        const d = document.createElement("div");
        d.className = "msg " + cls;
        d.innerText = txt;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
        return d;
      }
    });
  </script>
</body>
</html>
